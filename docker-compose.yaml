services:

  redis:
    image: redis:5.0.4
    restart: on-failure

  db:
    image: postgres:15.1-alpine
    restart: on-failure
    env_file: .env
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 3s
      retries: 10
      timeout: 3s

  migrations:
    build: .
    env_file: .env
    command: sh -c "poetry run python manage.py migrate"
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    env_file: .env
    tty: true
    ports:
      - "8000:8000"
    command: sh -c "poetry run python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  celery:
    build: .
    tty: true
    command:  celery -A config worker -l info
    restart: on-failure
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
      - app

  celery-beat:
    build: .
    tty: true
    command: celery -A config beat -l info
    restart: on-failure
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
      - app

volumes:
  pg_data:
